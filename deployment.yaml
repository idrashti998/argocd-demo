apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-demo
  namespace: deploy
spec:
  replicas: 10
  selector:
    matchLabels:
      app: argocd-demo
  template:
    metadata:
      labels:
        app: argocd-demo
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
